{{- if .Values.analytics.enabled }}
{{- include "pick-face-replenishment.requireAnalyticsConfig" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pick-face-replenishment.analyticsProjectorFullname" . }}
  labels:
    {{- include "pick-face-replenishment.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  replicas: {{ .Values.analytics.projector.replicaCount }}
  selector:
    matchLabels:
      {{- include "pick-face-replenishment.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "pick-face-replenishment.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pick-face-replenishment.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "pick-face-replenishment.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/pfr-projector"]
          ports:
            - name: http
              containerPort: {{ .Values.analytics.projector.adminPort }}
              protocol: TCP
          # Env contract verified against cmd/pfr-projector/main.go:
          # ANALYTICS_DATABASE_URL (required, direct DSN: the projector never
          # opens the OLTP database), KAFKA_BROKERS (required), the stable
          # ANALYTICS_CONSUMER_GROUP (required, no default, so a rescheduled
          # pod resumes from committed offsets), ADMIN_ADDR and LOG_LEVEL. It
          # reads no OLTP env: no DATABASE_URL and none of the cmd/api
          # *_CONSUMER_GROUP variables.
          env:
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pick-face-replenishment.analyticsSecretName" . }}
                  key: {{ .Values.analytics.existingSecretKey }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.analytics.consumerGroup | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- range .Values.analytics.projector.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # /healthz (never flipped) and /readyz (flips to 503 as the first
          # step of shutdown) on the admin port.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
