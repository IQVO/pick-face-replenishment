{{- if and .Values.analytics.enabled .Values.analytics.reports.route.enabled -}}
{{- /*
Analytics reports exposure through Kong — replaces the Terraform-side
null_resource reports HTTPRoutes (services.tf), for the same reason as
kong-plugins.yaml: chart-rendered routes are Helm/ArgoCD-reconciled forever,
kubectl-applied ones silently vanish on rebuild and nothing notices.

Host contract: /api/pick-face-replenishment/reports -> Service
pick-face-replenishment-reports:80, prefix rewritten to /reports (the reports
binary registers GET /reports/<report-name>, not a bare /<name>).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pick-face-replenishment.analyticsReportsFullname" . }}
  labels:
    {{- include "pick-face-replenishment.labels" . | nindent 4 }}
    app.kubernetes.io/component: reports
  annotations:
    konghq.com/plugins: {{ include "pick-face-replenishment.kongPluginNames" . | quote }}
    # Kong's traditional router compiles this PathPrefix and the API route's
    # /api/<context> prefix into regex paths of equal priority and picks between
    # them in no fixed order; the reports prefix must outrank the API prefix.
    konghq.com/regex-priority: "10"
spec:
  parentRefs:
    {{- range .Values.analytics.reports.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.analytics.reports.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: {{ include "pick-face-replenishment.analyticsReportsFullname" . }}
          port: {{ .Values.analytics.reports.service.port }}
{{- end }}
