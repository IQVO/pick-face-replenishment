# Used by `helm lint` / `ct lint`: every optional value set at once.
database:
  existingSecret: "pick-face-replenishment-db"
kafka:
  brokers: "kafka-0.kafka.warehouse-systems.svc.cluster.local:9092,kafka-1.kafka.warehouse-systems.svc.cluster.local:9092"
config:
  logLevel: "debug"
  outboxRelayInterval: "500ms"
  outboxMaxAttempts: 20
  forwardZoneCodes: "FWD,FWD2"
  reserveZoneCodes: "RSV,BULK"
  shutdownDrainDelay: "5s"
  inventoryConsumerGroup: "pick-face-replenishment-inventory"
  slottingConsumerGroup: "pick-face-replenishment-slotting"
  layoutConsumerGroup: "pick-face-replenishment-layout"
  packLevelConsumerGroup: "pick-face-replenishment-pack-levels"
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/pick-face-replenishment
      pathType: PathPrefix
kongPlugins:
  cors:
    enabled: true
    origin: "http://localhost"
  prometheus:
    enabled: true
  opentelemetry:
    enabled: true
autoscaling:
  api:
    enabled: true

# Every optional COMPONENT at once (api + mcp + a2a + projector + reports +
# frontend), so a template that renders alone but collides with another is
# caught by `helm lint`.
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
a2a:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
analytics:
  enabled: true
  existingSecret: "pick-face-replenishment-analytics-db"
  consumerGroup: "pick-face-replenishment-analytics"
frontend:
  enabled: true
